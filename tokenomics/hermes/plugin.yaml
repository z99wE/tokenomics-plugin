name: tokenomics
version: 2.0.0
title: "Tokenomics"
description: "Tokenomics agentic-efficiency suite: compresses agent prose, minimizes code generation, propagates to subagents, gamification, learned compression, selective domain rules, preview-pane widget. Inspired by caveman and ponytail, engineered independently."
author: "Tokenomics Contributors"
api: hermes/__init__.py
requires_hermes: ">=0.22.0"
defaultEnabled: false
provides_tools:
  - tokenomics.enable
  - tokenomics.disable
  - tokenomics.status
  - tokenomics.estimate
  - tokenomics.review
  - tokenomics.audit
  - tokenomics.domain
  - tokenomics.achievements
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - on_session_start
  - on_session_end
  - delegate_task
requires_env: []
