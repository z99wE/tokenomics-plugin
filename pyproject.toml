[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenomics"
version = "2.0.0"
description = "Tokenomics agentic-efficiency suite: compress agent prose, minimize code generation, track token savings. Inspired by caveman and ponytail, engineered independently."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Tokenomics Contributors"}]
keywords = ["ai", "agent", "token", "compression", "cli", "skill", "gamification", "agentic", "efficiency", "token-savings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
]

[project.optional-dependencies]
tiktoken = ["tiktoken>=0.14.0"]

[project.scripts]
tokenomics = "tokenomics.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tokenomics*"]

[tool.lint]
select = ["E", "F", "I", "B", "C4", "PLC", "PLE", "RET", "TRY"]
ignore = ["E501", "B008", "F401"]
line-length = 100
target-version = "py39"

[tool.lint.per-file-ignores]
"tokenomics/tests/*" = ["F401", "E501", "B008"]
