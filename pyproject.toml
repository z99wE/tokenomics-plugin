[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenomics"
version = "1.0.0"
description = "Enhanced Caveman + Ponytail suite: compress agent prose, minimize code, save tokens, gamification"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Tokenomics Contributors"}]
keywords = ["ai", "agent", "token", "compression", "caveman", "ponytail", "cli", "skill", "gamification"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
]

[project.optional-dependencies]
tiktoken = ["tiktoken>=0.5.0"]

[project.scripts]
tokenomics = "tokenomics.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tokenomics*"]
